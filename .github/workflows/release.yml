name: Build and publish release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '手动发布时使用的版本标签，例如 v0.1.1；留空则按 package.json 版本自动生成'
        required: false
        type: string

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build desktop package
        run: pnpm make-bsp && pnpm tauri:build
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cs15-web-${{ matrix.label }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
      # 功能说明：手动运行时准备发布工件，标签可由发布任务自动生成；时间：2026-10-31；作者：lq
      - name: Prepare desktop assets for GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cs15-web-${{ matrix.label }}-release
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg

  web-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build source-free web ZIP
        run: RELEASE_VERSION=${GITHUB_REF_NAME#v} pnpm package:release
      - name: Upload web ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cs15-web-web-zip
          path: release/*.zip

  publish:
    # 功能说明：标签推送或手动运行时发布 GitHub Release；时间：2026-10-31；作者：lq
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [desktop, web-zip]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: cs15-web-*-release
          merge-multiple: true
      - name: Download web ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: cs15-web-web-zip
          path: release-assets
      # 功能说明：空标签时按 package.json 版本自动创建标签，已存在时追加运行号；时间：2026-10-31；作者：lq
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            tag="${{ inputs.release_tag }}"
          else
            version="$(node -p "require('./package.json').version")"
            tag="v${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              tag="${tag}-run-${GITHUB_RUN_NUMBER}"
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tag}"
      - name: Publish one GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          tag_name: ${{ steps.release_tag.outputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release-assets/**/*
