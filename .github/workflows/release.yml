name: Build and publish release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '手动发布时使用的版本标签，例如 v0.1.1；留空则按 package.json 版本自动生成'
        required: false
        type: string

permissions:
  contents: write

jobs:
  desktop:
    env:
      # 功能说明：把 secret 是否存在转换成可用于步骤条件的标记，避免在 if 表达式中直接读取 secrets；时间：2026-10-31；作者：lq
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          # 功能说明：分别构建 Intel 与 Apple Silicon macOS 安装包，避免用户下载到不兼容架构；时间：2026-10-31；作者：lq
          - os: macos-13
            label: macos-x64
          - os: macos-14
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      # 功能说明：有 Apple Developer 证书时导入临时钥匙串，供 Tauri 完成正式签名和公证；时间：2026-10-31；作者：lq
      - name: Import Apple Developer certificate
        if: startsWith(matrix.os, 'macos-') && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security default-keychain -s build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security set-keychain-settings -t 3600 -u build.keychain-db
          security import certificate.p12 -k build.keychain-db -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain-db
          CERT_ID="$(security find-identity -v -p codesigning build.keychain-db | awk -F '"' 'NR == 1 { print $2 }')"
          test -n "$CERT_ID"
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          rm -f certificate.p12
      - name: Build desktop package
        env:
          # 功能说明：无付费证书时使用 ad-hoc 签名，避免 Apple Silicon 下载包被判定为“已损坏”；时间：2026-10-31；作者：lq
          APPLE_CERTIFICATE_PRESENT: ${{ secrets.APPLE_CERTIFICATE != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # 功能说明：Windows runner 默认使用 PowerShell，显式切换 Git Bash 以执行统一的 Bash 构建脚本；时间：2026-10-31；作者：lq
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == macos-* ]]; then
            if [[ "$APPLE_CERTIFICATE_PRESENT" == "true" ]]; then
              if [[ -z "$APPLE_ID" || -z "$APPLE_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
                echo "APPLE_ID、APPLE_PASSWORD、APPLE_TEAM_ID 必须与 APPLE_CERTIFICATE 一起配置，才能发布 macOS 公证包。" >&2
                exit 1
              fi
            else
              export APPLE_SIGNING_IDENTITY="-"
            fi
          fi
          pnpm make-bsp
          # 功能说明：macOS runner 原生构建本机架构，使用 target/release，避免显式同架构 --target 造成 Tauri 找错主程序路径；时间：2026-10-31；作者：lq
          pnpm tauri:build
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cs15-web-${{ matrix.label }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
      # 功能说明：手动运行时准备发布工件，标签可由发布任务自动生成；时间：2026-10-31；作者：lq
      - name: Prepare desktop assets for GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cs15-web-${{ matrix.label }}-release
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg

  web-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build source-free web ZIP
        run: RELEASE_VERSION=${GITHUB_REF_NAME#v} pnpm package:release
      - name: Upload web ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cs15-web-web-zip
          path: release/*.zip

  publish:
    # 功能说明：标签推送或手动运行时发布 GitHub Release；时间：2026-10-31；作者：lq
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [desktop, web-zip]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: cs15-web-*-release
          merge-multiple: true
      - name: Download web ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: cs15-web-web-zip
          path: release-assets
      # 功能说明：空标签时按 package.json 版本自动创建标签，已存在时追加运行号；时间：2026-10-31；作者：lq
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            tag="${{ inputs.release_tag }}"
          else
            version="$(node -p "require('./package.json').version")"
            tag="v${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              tag="${tag}-run-${GITHUB_RUN_NUMBER}"
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tag}"
      - name: Publish one GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          tag_name: ${{ steps.release_tag.outputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release-assets/**/*
