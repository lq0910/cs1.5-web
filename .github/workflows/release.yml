name: Build and publish release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build desktop package
        run: pnpm make-bsp && pnpm tauri:build
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cs15-web-${{ matrix.label }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
      - name: Publish desktop assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: cs15-web-${{ matrix.label }}-release
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg

  web-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build source-free web ZIP
        run: RELEASE_VERSION=${GITHUB_REF_NAME#v} pnpm package:release
      - name: Upload web ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cs15-web-web-zip
          path: release/*.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, web-zip]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: cs15-web-*-release
          merge-multiple: true
      - name: Download web ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: cs15-web-web-zip
          path: release-assets
      - name: Publish one GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
