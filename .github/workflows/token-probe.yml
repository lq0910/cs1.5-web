name: token probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # 功能说明：临时探针，验证 GITHUB_TOKEN 在声明 contents: write 后是否真的能写仓库；用完即删；时间：2026-10-31；作者：lq
      - name: Probe GITHUB_TOKEN write access
        env:
          T: ${{ github.token }}
        run: |
          set -uo pipefail
          probe="ci-perm-probe-${GITHUB_RUN_ID}"
          code=$(curl -s -o /tmp/create.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${T}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs" \
            -d "{\"ref\":\"refs/tags/${probe}\",\"sha\":\"${GITHUB_SHA}\"}")
          echo "tag_create=$code"
          cat /tmp/create.json
          echo
          if [ "$code" = "201" ]; then
            del=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${T}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/tags/${probe}")
            echo "tag_delete=$del"
          fi
          rel=$(curl -s -o /tmp/rel.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${T}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"${probe}\",\"name\":\"${probe}\",\"draft\":true,\"body\":\"probe\"}")
          echo "release_draft=$rel"
          cat /tmp/rel.json
          echo
          if [ "$rel" = "201" ]; then
            rid=$(python3 -c "import json;print(json.load(open('/tmp/rel.json'))['id'])")
            dr=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${T}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/${rid}")
            echo "release_delete=$dr"
          fi
